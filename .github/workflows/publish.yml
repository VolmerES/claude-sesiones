name: Publish

# Publica en npm al publicar una release de GitHub (etiqueta vX.Y.Z), con trusted
# publishing: sin tokens, y npm enseña de qué commit sale cada versión.
# La primera versión se publica a mano; después se da de alta este flujo en
# npmjs.com → claude-sesiones → Settings → Trusted publishing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'VolmerES/claude-sesiones'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
        package-manager-cache: false

    # Trusted publishing necesita npm 11.5.1 o posterior
    - name: Update npm
      run: npm install -g npm@11

    - name: Install dependencies
      run: npm ci

    - name: Run release checks
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run build
        npm pack --dry-run

    - name: Verify release tag matches package version
      if: github.event_name == 'release'
      run: |
        VERSION=$(node -p "require('./package.json').version")
        TAG="${GITHUB_REF_NAME#v}"
        if [ "$VERSION" != "$TAG" ]; then
          echo "package.json version ($VERSION) does not match release tag ($TAG)"
          exit 1
        fi

    - name: Publish to npm
      run: npm publish --access public
